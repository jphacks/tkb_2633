name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    env:
      HOUSEWORK_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure required feature regressions are still present
        run: node scripts/check-feature-contracts.mjs

      - name: Lint, typecheck, and test
        run: npm run check
